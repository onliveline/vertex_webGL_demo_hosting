<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | onXT Vertex Web</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      #mobile-browser-warning {
        box-sizing: border-box;
        display: none;
        align-items: center;
        gap: 14px;
        position: fixed;
        z-index: 2147483646;
        left: 16px;
        right: 16px;
        bottom: 16px;
        padding: 14px 16px;
        border: 1px solid rgba(255,255,255,.24);
        border-radius: 10px;
        background: rgba(8,20,24,.94);
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        line-height: 1.35;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.36);
      }
      #mobile-browser-warning span { flex: 1; }
      #mobile-warning-close,
      #mobile-warning-toggle {
        border: 1px solid rgba(255,255,255,.3);
        border-radius: 999px;
        background: rgba(255,255,255,.12);
        color: #fff;
        min-width: 38px;
        height: 38px;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
      }
      #mobile-warning-toggle {
        display: none;
        position: fixed;
        z-index: 2147483645;
        left: 16px;
        bottom: 16px;
        width: 38px;
        padding: 0;
      }
      #rotate-device-overlay {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 32px;
        background: rgba(4,12,16,.96);
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
      }
      #rotate-device-overlay .rotate-device-icon {
        width: 64px;
        height: 64px;
        animation: rotate-device-hint 2s ease-in-out infinite;
      }
      @keyframes rotate-device-hint {
        0%, 20% { transform: rotate(0deg); }
        55%, 80% { transform: rotate(90deg); }
        100% { transform: rotate(90deg); }
      }
      #rotate-device-overlay h2 { margin: 0; font-size: 20px; font-weight: 700; }
      #rotate-device-overlay p { margin: 0; max-width: 420px; font-size: 14px; line-height: 1.45; color: rgba(255,255,255,.82); }
      #rotate-device-continue {
        margin-top: 8px;
        padding: 10px 22px;
        border: 1px solid rgba(255,255,255,.3);
        border-radius: 999px;
        background: rgba(255,255,255,.12);
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="mobile-browser-warning" role="dialog" aria-live="polite" aria-label="Mobile browser warning">
      <span>This experience is designed for desktop and laptop browsers. On mobile devices it may not run optimally &mdash; landscape mode is recommended.</span>
      <button id="mobile-warning-close" aria-label="Dismiss mobile browser warning">&#215;</button>
    </div>
    <button id="mobile-warning-toggle" aria-label="Reopen mobile browser warning">i</button>
    <div id="rotate-device-overlay" role="dialog" aria-label="Rotate device">
      <svg class="rotate-device-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="22" y="8" width="20" height="48" rx="4" fill="none" stroke="#fff" stroke-width="3"/>
        <circle cx="32" cy="49" r="2.4" fill="#fff"/>
      </svg>
      <h2>Please rotate your device</h2>
      <p>This experience works best in landscape mode. Turn your device sideways to continue.</p>
      <button id="rotate-device-continue">Continue in portrait</button>
    </div>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=785 height=441 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">onXT Vertex Web</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var fixedCanvasWidth = 785;
      var fixedCanvasHeight = 441;
      var isMobileBrowser = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
        (navigator.userAgent.indexOf("Mac") !== -1 && navigator.maxTouchPoints > 1);

      var mobileWarning = document.querySelector("#mobile-browser-warning");
      var mobileWarningToggle = document.querySelector("#mobile-warning-toggle");
      if (isMobileBrowser) {
        mobileWarning.style.display = "flex";
      }
      document.querySelector("#mobile-warning-close").onclick = function () {
        mobileWarning.style.display = "none";
        mobileWarningToggle.style.display = "block";
      };
      mobileWarningToggle.onclick = function () {
        mobileWarning.style.display = "flex";
        mobileWarningToggle.style.display = "none";
      };

      if (isMobileBrowser) {
        // Best effort only: browsers that support it (mostly Android in
        // fullscreen) will lock, everything else rejects and we fall back
        // to the rotate overlay below.
        var tryLockLandscape = function () {
          try {
            if (screen.orientation && screen.orientation.lock) {
              var lockPromise = screen.orientation.lock("landscape");
              if (lockPromise && lockPromise.catch) lockPromise.catch(function () {});
            }
          } catch (e) {}
        };
        document.addEventListener("touchend", tryLockLandscape, true);
        document.addEventListener("click", tryLockLandscape, true);
        tryLockLandscape();

        var rotateOverlay = document.querySelector("#rotate-device-overlay");
        var rotateContinue = document.querySelector("#rotate-device-continue");
        var rotateDismissed = false;
        try { rotateDismissed = sessionStorage.getItem("vertexRotateDismissed") === "1"; } catch (e) {}
        var isPortrait = function () {
          if (screen.orientation && screen.orientation.type) return screen.orientation.type.indexOf("portrait") === 0;
          return window.innerHeight > window.innerWidth;
        };
        var updateRotateOverlay = function () {
          rotateOverlay.style.display = (isPortrait() && !rotateDismissed) ? "flex" : "none";
        };
        rotateContinue.onclick = function () {
          rotateDismissed = true;
          try { sessionStorage.setItem("vertexRotateDismissed", "1"); } catch (e) {}
          updateRotateOverlay();
        };
        window.addEventListener("resize", updateRotateOverlay);
        window.addEventListener("orientationchange", updateRotateOverlay);
        if (screen.orientation && screen.orientation.addEventListener) {
          screen.orientation.addEventListener("change", updateRotateOverlay);
        }
        updateRotateOverlay();
      }


      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/1ba7c23309011fbafb584d78b02577f5.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/ca8c6aca98ce4263d201e201896a4946.data.unityweb",
        frameworkUrl: buildUrl + "/b7105a191be8e243548d341e89263ef1.framework.js.unityweb",
        codeUrl: buildUrl + "/b109bc91b1184ef42e7f4d781f508517.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "onXT",
        productName: "onXT Vertex Web",
        productVersion: "0.1.0",        cacheControl: function (url) {
          if (url.match(/\.data/) || url.match(/\.bundle/)) {
            return "must-revalidate";
          }
          return "no-store";
        },
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (isMobileBrowser) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = fixedCanvasWidth + "px";
        canvas.style.height = fixedCanvasHeight + "px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";
      document.querySelector("#unity-fullscreen-button").style.display = "none";

      config.devicePixelRatio = isMobileBrowser ? 1 : (window.devicePixelRatio || 1);

      if (navigator.audioSession) navigator.audioSession.type = "playback";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = null;

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
